<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AETHER BLADE — 聖樹傳說 (PixiJS v8 GPU 引擎版)</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="stage-shell">
      <div id="canvas-wrap">
        <div id="pixi-mount" style="width: 100%; height: 100%"></div>
      </div>

      <div id="touch-controls" aria-label="行動端虛擬手把">
        <div class="touch-dpad">
          <button class="tbtn" data-key="ArrowLeft" aria-label="左">◀</button>
          <div class="touch-dpad-mid">
            <button class="tbtn small" data-key="ArrowUp" aria-label="上">▲</button>
            <button class="tbtn small" data-key="ArrowDown" aria-label="下">▼</button>
          </div>
          <button class="tbtn" data-key="ArrowRight" aria-label="右">▶</button>
        </div>
        <div class="touch-actions">
          <button class="tbtn switch" data-key="KeyQ">切換</button>
          <button class="tbtn roll" data-key="ShiftLeft">翻滾</button>
          <button class="tbtn item" data-key="KeyE">道具</button>
          <button class="tbtn sword" data-key="Space">揮劍</button>
        </div>
      </div>

      <footer id="controls-bar">
        <span class="badge" id="area-pill">PIXI v8 • 聖樹平原</span>
        <button id="touch-toggle-btn" class="mini-btn" type="button">🎮 觸控手把</button>
        <span><kbd>WASD</kbd> / <kbd>↑↓←→</kbd> 移動</span>
        <span><kbd>Space</kbd> 揮劍（長按迴旋斬・滿血劍氣）</span>
        <span><kbd>E</kbd> 道具</span>
        <span><kbd>Q</kbd> 切換（炸彈/迴力鏢/聖火法杖）</span>
        <span><kbd>Shift</kbd> 翻滾</span>
        <span><kbd>G</kbd> Pixi Filter</span>
        <span><kbd>M</kbd> 靜音</span>
        <span><kbd>R</kbd> 重來</span>
      </footer>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
